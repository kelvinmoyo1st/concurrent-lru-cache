spring.application.name=concurrent-lru-cache
cache.capacity=5
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cachedb}
spring.datasource.username=${DB_USER:cacheuser}
spring.datasource.password=${DB_PASSWORD:cachepass}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
